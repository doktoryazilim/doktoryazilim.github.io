      pctEl.value = 10;
      syncSaleFromPct();
    }
  } else {
    fields.style.display = 'none';
    pctEl.value = '';
    saleEl.value = '';
  }
}
function syncSaleFromPct(){
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const pctEl = document.getElementById('f-discpct');
  const pct = parseFloat(pctEl.value);
  const saleEl = document.getElementById('f-sale');
  if(!pctEl.value.trim() || isNaN(pct)){ return; }
  if(price>0){ saleEl.value = Math.round(price * (1 - pct/100)); }
}
function syncPctFromSale(){
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const saleEl = document.getElementById('f-sale');
  const sale = parseFloat(saleEl.value);
  const pctEl = document.getElementById('f-discpct');
  if(!saleEl.value.trim() || isNaN(sale)){ pctEl.value=''; return; }
  if(price>0){ pctEl.value = Math.round((1 - sale/price)*100); }
}
function syncDiscountFromPrice(){
  const pctEl = document.getElementById('f-discpct');
  if(pctEl.value.trim()){ syncSaleFromPct(); }
  else { syncPctFromSale(); }
}
let SAVING_PRODUCT = false;
async function saveProduct(editing){
  if(SAVING_PRODUCT) return; // çift tıklamada aynı ürün iki kez eklenmesin
  SAVING_PRODUCT = true;
  try{ await saveProductImpl(editing); }
  catch(e){ console.error('Ürün kaydetme hatası', e); showToast('Ürün kaydedilemedi: ' + String((e && e.message) || e).slice(0,100)); }
  finally{ SAVING_PRODUCT = false; }
}
async function saveProductImpl(editing){
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-cat').value;
  let image = document.getElementById('f-img').value.trim();
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const saleRaw = document.getElementById('f-sale').value;
  const salePrice = saleRaw ? parseFloat(saleRaw) : null;
  const isNew = document.getElementById('f-new').checked;
  const featured = document.getElementById('f-feat').checked;
  const description = (document.getElementById('f-desc') ? document.getElementById('f-desc').value : '').trim();
  const stockRaw = document.getElementById('f-stock').value.trim();
  const stock = stockRaw === '' ? null : Math.max(0, parseInt(stockRaw, 10) || 0);
  if(!name){ showToast('Lütfen ürün adı girin'); return; }
  if(document.getElementById('f-onsale').checked && !salePrice){ showToast('İndirimli için önce Fiyat (₺) alanını doldurun'); return; }
  const newId = (editing==='new') ? uuid() : null;
  // Fotoğraf zaten tarayıcıda küçültülüp (~50KB) hazır; Storage'a yükleme denemesi
  // beklemeye yol açtığı için kaldırıldı, fotoğraf doğrudan ürünle birlikte kaydedilir.
  if(editing==='new'){ DATA.products.unshift({ id:newId, name, category, price, salePrice, image, description, isNew, featured, stock, addedAt:Date.now() }); }
  else {
    const p = DATA.products.find(p=>String(p.id)===String(editing));
    if(!p){ showToast('Ürün bulunamadı, sayfayı yenileyip tekrar deneyin'); return; }
    Object.assign(p, {name, category, price, salePrice, image, description, isNew, featured, stock});
  }
  ADMIN.editingProduct = null;
  render();
  showToast('Kaydediliyor...');
  // "Kaydedildi" mesajı artık buluta yazma gerçekten bitince gösterilir
  const ok = await saveData();
  if(ok) showToast('Ürün kaydedildi ✓');
}

function svgBarChart(labels, values, opts){
  opts = opts || {};
  const W = opts.width || 720, H = opts.height || 260;
  const padL = 54, padB = 34, padT = 16, padR = 16;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxV = Math.max(1, ...values);
  const n = values.length;
  const gap = n > 0 ? chartW / n : chartW;
  const barW = Math.max(6, gap * 0.55);
  const gridLines = 4;
  let gridSvg = '';
  for(let g=0; g<=gridLines; g++){
    const y = padT + chartH - (chartH * g/gridLines);
    const val = Math.round(maxV * g/gridLines);
    gridSvg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${y+4}" font-size="10" fill="var(--muted)" text-anchor="end">${val>=1000?Math.round(val/1000)+'B':val}</text>`;
  }
  let bars = '';
  values.forEach((v,i)=>{
    const bh = maxV>0 ? (v/maxV) * chartH : 0;
    const x = padL + gap*i + (gap-barW)/2;
    const y = padT + chartH - bh;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="var(--amber)"><title>${esc(labels[i])}: ${money(v)}</title></rect>`;
    bars += `<text x="${x+barW/2}" y="${padT+chartH+18}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-width:${W}px;">${gridSvg}${bars}</svg>`;
}
function adminReports(){
  const orders = DATA.orders || [];
  const totalRevenue = orders.reduce((s,o)=>s+(o.total||0),0);
  const totalItemsSold = orders.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0);
  const totalOrders = orders.length;
  const avgOrder = totalOrders ? totalRevenue/totalOrders : 0;

  // Aylık: son 12 ay
  const now = new Date();
  const monthLabels = [], monthRevenue = [], monthItems = [];
  for(let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear()+'-'+d.getMonth();
    monthLabels.push(d.toLocaleDateString('tr-TR', {month:'short', year:'2-digit'}));
    let rev = 0, items = 0;
    orders.forEach(o=>{
      const od = new Date(o.date);
      if(od.getFullYear()===d.getFullYear() && od.getMonth()===d.getMonth()){ rev += o.total||0; items += o.items.reduce((s,i)=>s+i.qty,0); }
    });
    monthRevenue.push(rev); monthItems.push(items);
  }

  // Yıllık: siparişlerin kapsadığı tüm yıllar
  const years = Array.from(new Set(orders.map(o=>new Date(o.date).getFullYear()))).sort();
  const yearLabels = years.length ? years.map(String) : [String(now.getFullYear())];
  const yearRevenue = yearLabels.map(y=>orders.filter(o=>new Date(o.date).getFullYear()===parseInt(y)).reduce((s,o)=>s+(o.total||0),0));
  const yearItems = yearLabels.map(y=>orders.filter(o=>new Date(o.date).getFullYear()===parseInt(y)).reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0));

  const isMonthly = ADMIN.reportView !== 'yearly';
  const labels = isMonthly ? monthLabels : yearLabels;
  const revenueVals = isMonthly ? monthRevenue : yearRevenue;
  const itemVals = isMonthly ? monthItems : yearItems;
  const periodRevenue = revenueVals[revenueVals.length-1] || 0;
  const periodItems = itemVals[itemVals.length-1] || 0;

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${money(totalRevenue)}</div><div class="l">Toplam Ciro (tüm zamanlar)</div></div>
    <div class="stat-card"><div class="n">${totalItemsSold}</div><div class="l">Toplam Satılan Ürün Adedi</div></div>
    <div class="stat-card"><div class="n">${totalOrders}</div><div class="l">Toplam Sipariş</div></div>
    <div class="stat-card"><div class="n">${money(avgOrder)}</div><div class="l">Ortalama Sipariş Tutarı</div></div>
  </div>
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <h3 style="margin:0;">Ciro Grafiği</h3>
      <div style="display:flex; gap:8px;">
        <button class="btn small ${isMonthly?'':'outline'}" onclick="setReportView('monthly')">Aylık (Son 12 Ay)</button>
        <button class="btn small ${isMonthly?'outline':''}" onclick="setReportView('yearly')">Yıllık</button>
      </div>
    </div>
    <div class="hint">${isMonthly ? 'Bu ayın' : ('Bu yılın')} cirosu: <b>${money(periodRevenue)}</b> · satılan ürün: <b>${periodItems}</b></div>
    ${orders.length ? svgBarChart(labels, revenueVals) : `<div class="empty" style="margin-top:14px;">Henüz sipariş yok, grafik burada görünecek.</div>`}
  </div>`;
}

/* ---------- Firebase Storage: görselleri veritabanına gömmek yerine URL olarak sakla ----------
   Firestore dokümanına Base64 gömülü görsel, ürün listesi her çekildiğinde indiriliyor ve
   siteyi yavaşlatıyor. Burada görsel Storage'a yüklenir, dokümanda sadece URL kalır.
   Gerekenler: Firebase planı Blaze + Storage etkin + Storage kuralları (yazılı not için README). */
function withTimeout(promise, ms, msg){
  return new Promise(function(resolve, reject){
    const t = setTimeout(function(){ reject(new Error(msg || 'Zaman aşımı')); }, ms);
    promise.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
  });
}
const STORAGE_UPLOAD_TIMEOUT_MS = 6000;
let STORAGE_DOWN_UNTIL = 0; // Storage yanıt vermezse kısa süre denemeyi bırak, fotoğraf doğrudan gömülsün
async function uploadDataUrlToStorage(dataUrl, folder, id){
  if(!firebaseReady || !firebaseStorageRef) throw new Error('Firebase Storage başlatılamadı');
  await withTimeout(firebaseAuthReadyPromise, 5000, 'Firebase girişi zaman aşımına uğradı');
  const m = /^data:([^;,]+)[;,]/.exec(dataUrl);
  const type = m ? m[1] : 'image/jpeg';
  const ext = ({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg'})[type] || 'jpg';
  const safeId = String(id).replace(/[^a-zA-Z0-9_-]/g,'-');
  const ref = firebaseStorageRef.child(folder + '/' + safeId + '-' + Date.now().toString(36) + '.' + ext);
  const task = ref.putString(dataUrl, 'data_url', { contentType:type, cacheControl:'public,max-age=31536000' });
  let snap;
  try{ snap = await withTimeout(task, STORAGE_UPLOAD_TIMEOUT_MS, 'Storage yanıt vermedi (etkin değil ya da kurallar yazmaya izin vermiyor olabilir)'); }
  catch(e){ try{ task.cancel(); }catch(_){} throw e; }
  return await withTimeout(snap.ref.getDownloadURL(), 8000, 'Görsel adresi alınamadı');
}
// Base64 görseli (sadece JPEG fotoğrafları) ~120KB / 1100px'e indirir; PNG'lere dokunmaz (şeffaflık bozulmasın).
function shrinkJpegDataUrl(dataUrl){
  return new Promise(function(resolve){
    if(!/^data:image\/jpe?g/i.test(dataUrl) || storedStringBytes(dataUrl) <= 150*1024){ resolve(dataUrl); return; }
    const img = new Image();
    img.onload = function(){
      try{
        const out = compressToTarget(img, 120*1024, 1100, 0.9);
        resolve(storedStringBytes(out) < storedStringBytes(dataUrl) ? out : dataUrl);
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}
function downloadJsonBackup(){
  try{
    const blob = new Blob([JSON.stringify({ products:DATA.products, hero:DATA.hero, promos:DATA.promos, categories:DATA.categories, logo:DATA.logo, partners:DATA.partners })], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'katalog-yedek-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    return true;
  }catch(e){ return false; }
}
function imageSlots(){
  const slots = [];
  (DATA.products||[]).forEach(function(p){ slots.push({ obj:p, key:'image', folder:'products', id:p.id, photo:true, maxBytes:PRODUCT_IMG_BYTES, maxDim:PRODUCT_IMG_MAXDIM }); });
  const h = DATA.hero;
  if(h && Array.isArray(h.images)) h.images.forEach(function(_,i){ slots.push({ obj:h.images, key:i, folder:'hero', id:'hero-'+i, maxBytes:150*1024, maxDim:1400 }); });
  (DATA.promos||[]).forEach(function(x,i){ slots.push({ obj:x, key:'image', folder:'promos', id:'promo-'+i, maxBytes:100*1024, maxDim:1000 }); });
  (DATA.categories||[]).forEach(function(c){
    slots.push({ obj:c, key:'image', folder:'categories', id:'cat-'+c.id, maxBytes:60*1024, maxDim:600 });
    (c.subs||[]).forEach(function(sc){ slots.push({ obj:sc, key:'image', folder:'categories', id:'sub-'+sc.id, maxBytes:60*1024, maxDim:600 }); });
  });
  if(DATA.logo) slots.push({ obj:DATA.logo, key:'image', folder:'site', id:'logo' });
  (DATA.partners||[]).forEach(function(x,i){ slots.push({ obj:x, key:'image', folder:'partners', id:'partner-'+i }); });
  return slots.filter(function(s){ return isDataUrl(s.obj[s.key]); });
}
async function migrateImagesToStorage(){
  const slots = imageSlots();
  const rep = function(html){ const el = document.getElementById('migrate-report'); if(el) el.innerHTML = html; };
  if(!slots.length){ showToast('Taşınacak Base64 görsel yok, hepsi zaten URL'); return; }
  if(!(await appConfirm(slots.length + ' görsel Firebase Storage\'a taşınacak. Önce otomatik yedek (JSON dosyası) indirilecek. Devam edilsin mi?', 'Taşı'))) return;
  if(!downloadJsonBackup()){
    if(!(await appConfirm('Yedek indirilemedi. Yine de devam edilsin mi?', 'Devam'))) return;
  }
  let ok = 0, fail = 0, lastErr = '';
  for(let i=0; i<slots.length; i++){
    const s = slots[i];
    showToast('Görseller taşınıyor... ' + (i+1) + '/' + slots.length);
    try{
      let data = s.obj[s.key];
      if(s.photo) data = await shrinkJpegDataUrl(data);
      const url = await uploadDataUrlToStorage(data, s.folder, s.id);
      s.obj[s.key] = url; ok++;
    }catch(e){
      fail++; lastErr = String((e && (e.code || e.message)) || e);
      console.error('Taşıma hatası', s.folder, s.id, e);
      if(ok === 0 && fail >= 2) break; // ilk ikisi de başarısızsa Storage kapalı/yetkisiz demektir, boşuna devam etme
    }
  }
  if(ok){ await saveData(); render(); }
  if(!ok){
    showToast('Taşıma başarısız: ' + lastErr.slice(0,100));
    rep('Hiçbir görsel taşınamadı (' + esc(lastErr) + '). Firebase planı Blaze mi, Storage etkin mi ve kurallar yazmaya izin veriyor mu kontrol edin. Hiçbir veri değiştirilmedi.');
  } else {
    showToast('Tamamlandı: ' + ok + ' görsel taşındı' + (fail ? ', ' + fail + ' başarısız' : ''));
    rep('Taşınan: ' + ok + ' | Başarısız: ' + fail + (fail ? ' (' + esc(lastErr) + ')' : '') + '. Yedek dosyasını güvenli bir yerde saklayın.');
  }
}
async function runSpeedReport(){
  const out = document.getElementById('speed-report');
  if(!out) return;
  const sizeOf = v => { try{ return JSON.stringify(v).length; }catch(e){ return 0; } };
  const mb = n => (n/1048576).toFixed(2) + ' MB';
  const kb = n => Math.round(n/1024) + ' KB';
  const parts = Object.keys(DATA).map(k=>[k, sizeOf(DATA[k])]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const total = sizeOf(DATA);
  const imgs = (DATA.products||[]).filter(p=>p.image);
  const imgBytes = imgs.reduce((sum,p)=>sum+String(p.image).length, 0);
  const big = imgs.slice().sort((a,b)=>String(b.image).length-String(a.image).length).slice(0,5);
  let cached = null;
  try{ cached = localStorage.getItem(CACHE_NS+'kdr_shared_'+STORAGE_KEY); }catch(e){}
  let idbv = null;
  try{ idbv = await idbCacheGet('catalog'); }catch(e){}
  const lines = [];
  lines.push('Toplam veri: ' + mb(total));
  lines.push('Ürün: ' + (DATA.products||[]).length + ' adet, fotoğraflı: ' + imgs.length + ', fotoğraf toplamı: ' + mb(imgBytes));
  lines.push('En büyük bölümler: ' + parts.map(x=>x[0]+' '+mb(x[1])).join(' | '));
  lines.push('En büyük 5 ürün fotoğrafı: ' + big.map(p=>esc(p.name||'?')+' '+kb(String(p.image).length)).join(' | '));
  lines.push('Tarayıcı önbelleği (hızlı açılış): ' + (cached ? 'VAR (' + mb(cached.length) + ')' : 'YOK — veri tarayıcıya sığmıyor/kaydedilemiyor olabilir'));
  lines.push('Yedek önbellek (IndexedDB): ' + (idbv ? 'VAR (' + mb(idbv.length) + ')' : 'YOK (siteyi bir kez normal açınca oluşur)'));
  out.innerHTML = lines.join('<br>');
}
async function optimizeProductImages(){
  // Ürün fotoğrafları + banner (hero) + promosyon + kategori görselleri (sadece JPEG; PNG/logo'ya dokunulmaz)
  const big = imageSlots().filter(function(sl){
    const v = sl.obj[sl.key];
    return sl.maxBytes && /^data:image\/jpe?g/i.test(v) && storedStringBytes(v) > sl.maxBytes * 1.15;
  });
  if(!big.length){ showToast('Tüm görseller zaten hafif'); return; }
  if(!(await appConfirm(big.length + ' görsel küçültülecek (ürünler, banner, promosyon, kategori). Görünüm neredeyse aynı kalır, site çok daha hızlı açılır. Önce otomatik yedek (JSON dosyası) indirilecek. Devam edilsin mi?', 'Optimize Et'))) return;
  downloadJsonBackup();
  let done = 0, savedKB = 0;
  for(const sl of big){
    showToast('Görseller küçültülüyor... ' + (done+1) + '/' + big.length);
    await new Promise(function(resolve){
      const img = new Image();
      img.onload = function(){
        try{
          const before = storedStringBytes(sl.obj[sl.key]);
          const out = compressToTarget(img, sl.maxBytes, sl.maxDim, 0.9);
          if(storedStringBytes(out) < before){ savedKB += Math.round((before - storedStringBytes(out))/1024); sl.obj[sl.key] = out; }
        }catch(e){ console.error('Optimize hatası', e); }
        done++; resolve();
      };
      img.onerror = function(){ done++; resolve(); };
      img.src = sl.obj[sl.key];
    });
  }
  await saveData();
  render();
  showToast('Tamamlandı: ' + done + ' görsel küçültüldü (~' + Math.round(savedKB/1024*10)/10 + ' MB tasarruf)');
}

function saveLogo(){
  const image = document.getElementById('s-logo-img').value.trim();
  const size = parseInt(document.getElementById('s-logo-size').value, 10) || 56;
  DATA.logo = { image, size };
  saveData(); render(); showToast('Logo kaydedildi');
}
function renderCurrencyChoice(){
  const v = document.getElementById('s-currency').value;
  const tryBtn = document.getElementById('s-cur-try');
  const usdBtn = document.getElementById('s-cur-usd');
  const eurBtn = document.getElementById('s-cur-eur');
  if(!tryBtn || !usdBtn || !eurBtn) return;
  tryBtn.classList.toggle('outline', v !== 'TRY');
  usdBtn.classList.toggle('outline', v !== 'USD');
  eurBtn.classList.toggle('outline', v !== 'EUR');
}
function saveThemeColor(){
  const hex = document.getElementById('s-theme-hex').value.trim();
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)){ showToast('Geçerli bir hex renk kodu girin (ör. #2563EB)'); return; }
  DATA.themeColor = hex;
  applyThemeColor(hex);
  saveData(); render(); showToast('Tema rengi kaydedildi');
}
function saveCurrency(){
  const cv = document.getElementById('s-currency').value;
  const currency = (cv === 'USD' || cv === 'EUR') ? cv : 'TRY';
  const rate = parseFloat(document.getElementById('s-usdrate').value);
  const eurRate = parseFloat(document.getElementById('s-eurrate').value);
  if(!rate || rate <= 0){ showToast('Geçerli bir dolar kuru girin'); return; }
  if(!eurRate || eurRate <= 0){ showToast('Geçerli bir euro kuru girin'); return; }
  DATA.currency = currency;
  DATA.usdRate = rate;
  DATA.eurRate = eurRate;
  saveData(); render();
  showToast(currency === 'USD' ? 'Artık USD ile satış yapılıyor' : (currency === 'EUR' ? 'Artık EURO ile satış yapılıyor' : 'Artık TL ile satış yapılıyor'));
}
function saveSettings(){
  DATA.siteName = document.getElementById('s-name').value;
  DATA.announcement = document.getElementById('s-announce').value;
  DATA.announcementEnabled = document.getElementById('s-announce-enabled').checked;
  saveData(); render(); showToast('Ayarlar kaydedildi');
}
async function resetAll(){
  if(!(await appConfirm('Tüm veriler sıfırlanacak. Emin misiniz?', 'Sıfırla'))) return;
  DATA = defaultData();
  saveData();
  clearAllOrdersFromFirestore();
  render(); showToast('Veriler sıfırlandı');
}

init();
</script>

<script>
/* Açılış animasyonu: sitedeki logoyu (yönetim panelinden yüklenen ya da varsayılan) kullanır */
(function(){
  var el = document.getElementById('fd-intro');
  if(!el) return;
  var done = function(){ if(el && el.parentNode){ el.parentNode.removeChild(el); } el = null; };
  el.addEventListener('animationend', function(e){ if(e.animationName === 'fdOut' || e.animationName === 'fdSkip') done(); });
  el.addEventListener('click', function(){ el.style.animation = 'fdSkip .3s ease forwards'; });
  setTimeout(done, 7000); // güvenlik: her durumda kaldır
  try{ if(sessionStorage.getItem('fd_skip_intro') === '1'){ sessionStorage.removeItem('fd_skip_intro'); done(); return; } }catch(e){}
  var src = '';
  try { src = (DATA && DATA.logo && DATA.logo.image) ? DATA.logo.image : DEFAULT_LOGO_IMG; } catch(e){}
  if(!src){ done(); return; }
  var img = document.getElementById('fd-intro-img');
  var shine = document.getElementById('fd-intro-shine');
  var start = function(){
    if(!el) return;
    var m = 'url("' + src + '")';
    shine.style.webkitMaskImage = m; shine.style.maskImage = m;
    el.className = 'go';
  };
  img.onload = start;
  img.onerror = done;
  img.src = src;
  if(img.complete && img.naturalWidth) start();
})();
</script>
